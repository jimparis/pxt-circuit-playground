name: Circuit Playground CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: circuit-playground-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test CPX + CPB
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # The orchestrator supplies the reproducible native-build scripts. Each
      # independently versioned repository is then checked out shallowly at
      # the exact commit used by production; only the target uses the revision
      # that triggered this workflow.
      - name: Check out pinned build scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: jimparis/makecode
          ref: e3a586357c5e3c48f661b50d1bcf284479e920d6
          sparse-checkout: scripts
          persist-credentials: false

      - name: Check out target revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: pxt-circuit-playground
          persist-credentials: false

      - name: Check out pinned PXT fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: jimparis/pxt
          ref: b6fd06e058f0bc3f078d734b5253a22127aed183
          path: pxt
          persist-credentials: false

      - name: Check out pinned CPB runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: jimparis/codal-circuit-playground-bluefruit
          ref: 30d62c331ea289d5b598e25676580dc6231bd390
          path: codal-circuit-playground-bluefruit
          persist-credentials: false

      - name: Check out pinned CPB bootloader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: jimparis/Adafruit_nRF52_Bootloader
          ref: 7836c7cc3d813ab18c7c010a4e6f8fb787f68adc
          path: Adafruit_nRF52_Bootloader
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            pxt/package-lock.json
            pxt-circuit-playground/package-lock.json

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-arm-none-eabi podman
          mkdir -p "$RUNNER_TEMP/podman-bin"
          ln -s /usr/bin/podman "$RUNNER_TEMP/podman-bin/docker"
          echo "$RUNNER_TEMP/podman-bin" >> "$GITHUB_PATH"
          podman pull docker.io/pext/yotta@sha256:54acddef1aac8e4a654e591b617e38da12d784da65e8ddc858e8c28fa8bc24e3

      - name: Build pinned PXT fork
        working-directory: pxt
        env:
          PXT_ENV: production
        run: |
          npm ci --ignore-scripts
          npm run prepare
          npm run build

      - name: Install target dependencies
        working-directory: pxt-circuit-playground
        run: npm ci

      - name: Build offline CPB firmware cache
        run: node scripts/build-pxt-cpb.js

      - name: Test target and both boards
        working-directory: pxt-circuit-playground
        env:
          CI: "true"
        run: npm test
