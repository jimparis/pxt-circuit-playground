name: Circuit Playground CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: circuit-playground-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test CPX + CPB
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # The orchestrator commit pins PXT, the CPB runtime, and the bootloader
      # used together by production. The target checkout below is replaced by
      # the revision that triggered this workflow so pull requests are tested
      # without weakening the other pins.
      - name: Check out pinned build workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jimparis/makecode
          ref: e3a586357c5e52382bca63fd19d51c1a4a20c20e
          submodules: recursive
          persist-credentials: false

      - name: Check out target revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: _target
          persist-credentials: false

      - name: Select target revision in build workspace
        run: |
          set -euo pipefail
          git -C pxt-circuit-playground fetch "$GITHUB_WORKSPACE/_target" HEAD
          git -C pxt-circuit-playground checkout --detach FETCH_HEAD
          test "$(git -C pxt-circuit-playground rev-parse HEAD)" = \
            "$(git -C _target rev-parse HEAD)"

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            pxt/package-lock.json
            pxt-circuit-playground/package-lock.json

      - name: Install native inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils-arm-none-eabi

      - name: Build pinned PXT fork
        working-directory: pxt
        env:
          PXT_ENV: production
        run: |
          npm ci --ignore-scripts
          npm run prepare
          npm run build

      - name: Install target dependencies
        working-directory: pxt-circuit-playground
        run: npm ci

      - name: Build offline CPB firmware cache
        run: node scripts/build-pxt-cpb.js

      - name: Test target and both boards
        working-directory: pxt-circuit-playground
        env:
          CI: "true"
        run: npm test
